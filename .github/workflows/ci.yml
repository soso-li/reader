name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m pytest apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run web:test
      - run: npm run web:typecheck

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: READER_API_TOKEN=ci-placeholder docker compose config --quiet
